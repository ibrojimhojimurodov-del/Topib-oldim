<body>

<div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition w-[92%] max-w-md"><div id="toast-msg" class="g rounded-2xl px-4 py-2 text-sm font-semibold text-center text-cyan-100"></div></div>

<header class="fixed top-0 inset-x-0 z-30 p-2 flex flex-col lg:flex-row gap-2 pointer-events-none">
  <div class="g rounded-2xl px-3 py-2 flex items-center justify-between gap-3 pointer-events-auto">

    <select id="dist" class="g rounded-xl px-3 py-2 text-sm font-semibold shrink-0 bg-slate-900"></select>

<script>
(function(){'use strict';
// ====== SOZLAMA: Supabase kalitlarini shu yerga qo'ying ======
const SUPABASE_URL='';      // https://xxxx.supabase.co
const SUPABASE_KEY='';      // anon public key
// =============================================================
const $=id=>document.getElementById(id);
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff">3D kutubxona yuklanmadi. Internetni tekshiring.</p>');return;}

const GRID=1000,PITCH=22,HALF=500,MAX_HOME=2,MAX_BIZ=11,LS='topib_oldi_local_v2';
const clampPlot=v=>Math.max(1,Math.min(1e6,Math.floor(Number(v))||1));
const p2g=n=>{n=clampPlot(n);const i=n-1;return{plotNum:n,row:Math.floor(i/GRID),col:i%GRID}};
const g2p=(r,c)=>(r<0||c<0||r>=GRID||c>=GRID)?null:r*GRID+c+1;
const g2w=(r,c)=>({x:(c-HALF)*PITCH,z:(r-HALF)*PITCH});
const w2g=(x,z)=>{const c=Math.max(0,Math.min(GRID-1,Math.round(x/PITCH+HALF))),r=Math.max(0,Math.min(GRID-1,Math.round(z/PITCH+HALF)));return{row:r,col:c,plotNum:g2p(r,c)}};

function districtOf(r,c){
  if(r>=486&&r<=506&&c>=462&&c<=488)return{n:'Tashkent City Biznes',z:'Kasb va Biznes'};
  if(r>=475&&r<=525&&c>=494&&c<=512)return{n:'Amir Temur Shohko‘chasi',z:'Kasb va Biznes'};
  if(r>=340&&r<=390&&c>=290&&c<=340)return{n:'Chorsu Savdo Markazi',z:'Kasb va Biznes'};
  if(r>=855&&r<=915&&c>=450&&c<=520)return{n:'Sergeli Avto-Sanoat',z:'Kasb va Biznes'};
  if(r>=220&&r<=270&&c>=750&&c<=820)return{n:'IT Park / Universitetlar',z:'Kasb va Biznes'};
  const T='Turar-joy';
  if(r<220&&c>=420&&c<700)return{n:'Yunusobod tumani',z:T};
  if(r<350&&c>=700)return{n:'Mirzo Ulug‘bek tumani',z:T};
  if(r<340&&c<290)return{n:'Olmazor tumani',z:T};
  if(r>=340&&r<520&&c<462)return{n:'Shayxontohur tumani',z:T};
  if(r>=350&&r<660&&c>=620)return{n:'Yashnobod tumani',z:T};
  if(r>=520&&r<680&&c<320)return{n:'Uchtepa tumani',z:T};
  if(r>=680&&r<855&&c<440)return{n:'Chilonzor tumani',z:T};
  if(r>=525&&r<750&&c>=440&&c<620)return{n:'Yakkasaroy tumani',z:T};
  if(r>=660&&c>=680)return{n:'Bektemir tumani',z:T};
  return{n:'Sergeli tumani',z:T};
}
// Tumanlar markazi (qator, ustun) — districtOf bilan mos
const DISTRICTS=[['🏡 Yunusobod',110,560],['🏡 Mirzo Ulug‘bek',150,850],['🏡 Olmazor',150,140],['🏡 Shayxontohur',450,200],['🏡 Yashnobod',560,840],['🏡 Uchtepa',600,150],['🏡 Chilonzor',760,200],['🏡 Yakkasaroy',640,520],['🏡 Bektemir',780,850],['🏡 Sergeli',950,300],['💼 Tashkent City Biznes',496,475],['💼 Amir Temur Shohko‘chasi',500,503],['💼 Chorsu Savdo',365,315],['💼 Sergeli Avto-Sanoat',885,485],['💼 IT Park',245,785]];

const LANDMARKS=[
 {id:'amir_temur',name:'Amir Temur Xiyoboni',tag:'Toshkent Markazi',desc:'Shahar markazidagi xiyobon va Amir Temur haykali maydoni.',pos:[0,0],likes:210},
 {id:'tele',name:'Toshkent Teleminorasi',tag:'Ramziy minora',desc:'Kuzatuv halqalari va miltillovchi mayoqli baland minora.',pos:[0,-132],likes:245},
 {id:'city',name:'Tashkent City Mall',tag:'Biznes markaz',desc:'Savdo majmuasi va uchta shisha osmono‘par.',pos:[-110,-44],likes:198},
 {id:'arena',name:'Humo Arena',tag:'Sport va konsert saroyi',desc:'Gumbaz tomli zamonaviy sport saroyi.',pos:[110,44],likes:184},
 {id:'chorsu',name:'Chorsu Bozori',tag:'Tarixiy majmua',desc:'Firuza gumbazli ulkan savdo majmuasi.',pos:[-110,-132],likes:192},
 {id:'magic',name:'Magic City Park',tag:'Istirohat bog‘i',desc:'Ko‘p minorali qasr va yashil sayilgoh.',pos:[-110,44],likes:188}];
const reserved=(x,z)=>LANDMARKS.some(l=>Math.abs(x-l.pos[0])<24&&Math.abs(z-l.pos[1])<24);

const CAREERS={clinic:['🏥','Klinika / Tibbiyot markazi','#ef4444'],it_company:['💻','IT Kompaniya','#0ea5e9'],autoservice:['🚗','Avtoservis / Tuning','#f97316'],restaurant:['🍔','Restoran / Kafe','#f59e0b'],academy:['🏫','O‘quv markazi / Universitet','#3b82f6'],supermarket:['🏪','Supermarket / Savdo markazi','#10b981'],barbershop:['💈','Barbershop / Go‘zallik saloni','#ec4899'],fitness:['🏋️','Fitnes klub','#8b5cf6'],bank:['🏦','Bank / Moliya markazi','#eab308'],factory:['🏭','Zavod / Ishlab chiqarish','#64748b'],fuel_ev:['⛽','Yoqilg‘i / Elektro-quvvatlash','#22c55e'],media_studio:['🎬','Media studiya / Kino','#a855f7']};
const HOMES={hitech_villa:'Zamonaviy Hi-Tech Villa',oriental_courtyard:'Milliy Sharqona Hovli',duplex:'Zamonaviy Dupleks'};
const CARS={none:['Yo‘q','#94a3b8'],gentra:['Chevrolet Gentra','#f8fafc'],malibu2:['Chevrolet Malibu 2','#1e293b'],tiggo7:['Chery Tiggo 7 Pro','#0284c7'],bmwm5:['BMW M5','#1d4ed8'],gelik:['Mercedes G-Class','#090d16'],bugatti:['Bugatti Chiron','#06b6d4']};

// ====== HOLAT ======
let sb=null,uid='local',state={plots:{},likes:{},atmo:'day',liked:[]};
LANDMARKS.forEach(l=>state.likes[l.id]=l.likes);
try{const s=JSON.parse(localStorage.getItem('topib_atmo')||'null');if(s)state.atmo=s;}catch(e){}
try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(s&&s.plots)state.plots=s.plots;if(s&&s.likes)Object.assign(state.likes,s.likes);}catch(e){}
const localSave=()=>{if(sb)return;try{localStorage.setItem(LS,JSON.stringify({plots:state.plots,likes:state.likes}))}catch(e){}};
const myPlot=cat=>Object.values(state.plots).find(p=>p.ownerId===uid&&p.category===cat);
let toastT;function notify(m){const t=$('toast');$('toast-msg').textContent=m;t.classList.remove('opacity-0');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('opacity-0'),3000)}
const open=id=>{$(id).classList.remove('hidden');$(id).classList.add('flex')},close=id=>{$(id).classList.add('hidden');$(id).classList.remove('flex')};
document.querySelectorAll('.modal').forEach(m=>{m.addEventListener('click',e=>{if(e.target===m||e.target.hasAttribute('data-x'))close(m.id)});});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal').forEach(m=>close(m.id))});
let totalBuilt=0;const setCount=n=>{totalBuilt=n;$('counter').textContent=n.toLocaleString()+' ta bino'};

// ====== SERVER (Supabase) ======
const rowToRec=r=>({...r.data,category:r.category,plotNum:r.plot_num,ownerId:r.owner_id});
const recToData=r=>{const d={...r};delete d.category;delete d.plotNum;delete d.ownerId;return d};
let needRebuild=true;
async function refreshTotal(){if(!sb)return setCount(Object.keys(state.plots).length);const{count}=await sb.from('plots').select('*',{count:'exact',head:true});if(count!=null)setCount(count)}
async function initServer(){
  if(!SUPABASE_URL||!SUPABASE_KEY||!window.supabase){$('srv').textContent='💾 Lokal';$('db-status').textContent='Hozir lokal rejim: ma’lumot faqat shu brauzerda saqlanadi. Hammaga umumiy qilish uchun fayl boshidagi SUPABASE_URL va SUPABASE_KEY ni to‘ldiring.';$('btn-reset').classList.remove('hidden');setCount(Object.keys(state.plots).length);return}
  try{
    sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    let{data:{session}}=await sb.auth.getSession();
    if(!session){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session}
    uid=session.user.id;state.plots={};
    const{data}=await sb.from('plots').select('*').eq('owner_id',uid);(data||[]).forEach(r=>state.plots[r.plot_num]=rowToRec(r));
    sb.channel('plots').on('postgres_changes',{event:'*',schema:'public',table:'plots'},p=>{
      if(p.eventType==='DELETE'){delete state.plots[p.old.plot_num]}else state.plots[p.new.plot_num]=rowToRec(p.new);needRebuild=true;refreshTotal()}).subscribe();
    $('srv').textContent='🟢 Server';$('db-status').textContent='Umumiy serverga ulangan. Hamma bir xil shaharni real vaqtda ko‘radi. Har kim 1 ta uy va 1 ta kasb binosi qura oladi.';
    refreshTotal();needRebuild=true;
  }catch(e){console.warn(e);sb=null;uid='local';$('srv').textContent='💾 Lokal';$('db-status').textContent='Serverga ulanib bo‘lmadi, lokal rejimda ishlayapti.';$('btn-reset').classList.remove('hidden');setCount(Object.keys(state.plots).length)}
}
let fetchKey='';
async function fetchChunk(c){
  if(!sb)return;const rMin=Math.max(0,c.row-8),rMax=Math.min(GRID-1,c.row+8),cMin=Math.max(0,c.col-8),cMax=Math.min(GRID-1,c.col+8);
  const key=rMin+'-'+cMin;if(key===fetchKey)return;fetchKey=key;const f=[];
  for(let r=rMin;r<=rMax;r++)f.push(`and(plot_num.gte.${r*GRID+cMin+1},plot_num.lte.${r*GRID+cMax+1})`);
  const{data,error}=await sb.from('plots').select('*').or(f.join(','));
  if(!error&&data){data.forEach(r=>state.plots[r.plot_num]=rowToRec(r));needRebuild=true}
}
async function savePlot(rec,oldNum){
  if(!sb){if(oldNum)delete state.plots[oldNum];state.plots[rec.plotNum]=rec;localSave();setCount(Object.keys(state.plots).length);return null}
  const oldRec=oldNum?state.plots[oldNum]:null;
  if(oldNum&&oldNum!==rec.plotNum)await sb.from('plots').delete().eq('plot_num',oldNum).eq('owner_id',uid);
  const q=oldNum===rec.plotNum?sb.from('plots').update({data:recToData(rec)}).eq('plot_num',rec.plotNum).eq('owner_id',uid):sb.from('plots').insert({plot_num:rec.plotNum,owner_id:uid,category:rec.category,data:recToData(rec)});
  const{error}=await q;
  if(error){if(oldRec&&oldNum!==rec.plotNum)await sb.from('plots').insert({plot_num:oldNum,owner_id:uid,category:oldRec.category,data:recToData(oldRec)});return error.code==='23505'?'band':'xato'}
  if(oldNum)delete state.plots[oldNum];state.plots[rec.plotNum]=rec;refreshTotal();return null;
}
async function deletePlot(n){
  if(sb){const{error}=await sb.from('plots').delete().eq('plot_num',n).eq('owner_id',uid);if(error)return false}
  delete state.plots[n];localSave();refreshTotal();return true;
}

// ====== SAHNA ======
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.5,950);camera.position.set(76,62,88);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,innerWidth<700?1.5:2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;
$('host').appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.06;controls.maxPolarAngle=Math.PI/2-.03;controls.minDistance=14;controls.maxDistance=260;controls.target.set(0,2,0);
const hemi=new THREE.HemisphereLight(0xe0f2fe,0x334155,1.2);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfffbeb,1.5);sun.castShadow=true;sun.shadow.mapSize.set(innerWidth<700?1024:2048,innerWidth<700?1024:2048);
Object.assign(sun.shadow.camera,{near:20,far:420,left:-160,right:160,top:160,bottom:-160});scene.add(sun,sun.target);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(26000,26000),new THREE.MeshStandardMaterial({color:0x1e293b,roughness:.9}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const landG=new THREE.Group(),chunkG=new THREE.Group(),trafficG=new THREE.Group(),fxG=new THREE.Group();scene.add(landG,chunkG,trafficG,fxG);
let landPick=[],plotPick=[],beacon=null,glowMats=[];

// umumiy geometriya va kesh (xotira oqmasligi uchun)
const UB=new THREE.BoxGeometry(1,1,1),UC=new THREE.CylinderGeometry(1,1,1,14),UK=new THREE.ConeGeometry(1,1,14),UD=new THREE.SphereGeometry(1,20,10,0,Math.PI*2,0,Math.PI/2);
const matC=new Map();
function M(color,e,metal){const k=color+'|'+(e||0)+'|'+(metal||0);let m=matC.get(k);if(!m){m=new THREE.MeshStandardMaterial({color,roughness:.4,metalness:metal||0,emissive:e?color:0x000000,emissiveIntensity:e||0});matC.set(k,m)}return m}

$('n-my').onclick=(()=>{let t=0;return()=>{const a=[myPlot('home'),myPlot('career')].filter(Boolean);if(!a.length)return notify('🧭 Hali hech narsa qurmagansiz');const c=a[t++%a.length];select('plot',c.plotNum,true)}})();

$('dist').innerHTML='<option value="">🧭 Tumanlar va maskanlar</option><optgroup label="Maskanlar">'+LANDMARKS.map(l=>`<option value="l:${l.id}">${l.name}</option>`).join('')+'</optgroup><optgroup label="Tumanlar va hududlar">'+DISTRICTS.map((d,i)=>`<option value="d:${i}">${d[0]} (#${g2p(d[1],d[2]).toLocaleString()})</option>`).join('')+'</optgroup>';
$('dist').onchange=e=>{const v=e.target.value;if(!v)return;if(v[0]==='l')select('landmark',v.slice(2),true);else{const d=DISTRICTS[+v.slice(2)];select('plot',g2p(d[1],d[2]),true)}e.target.value=''};
$('jump').onsubmit=e=>{e.preventDefault();const v=parseInt($('jump-in').value,10);if(!v||v<1||v>1e6)return notify('⚠️ 1 dan 1,000,000 gacha kiriting');select('plot',v,true)};
const ATM=['day','sunset','night'];
function setAtmo(m){state.atmo=m;try{localStorage.setItem('topib_atmo',JSON.stringify(m))}catch(e){}
  const a={day:[0x7dd3fc,0xbae6fd,1.25,1.55,0xfffbeb,'☀️'],sunset:[0x9a3412,0xc2410c,.95,1.4,0xfb923c,'🌇'],night:[0x050a18,0x050a18,.72,.65,0x93c5fd,'🌙']}[m];
  scene.background=new THREE.Color(a[0]);scene.fog=new THREE.FogExp2(a[1],.0024);hemi.intensity=a[2];sun.intensity=a[3];sun.color.setHex(a[4]);$('btn-atmo').textContent=a[5];
  glowMats.forEach(x=>x.emissiveIntensity=m==='day'?.35:1.9)}
setAtmo(ATM.includes(state.atmo)?state.atmo:'day');
$('btn-atmo').onclick=()=>setAtmo(ATM[(ATM.indexOf(state.atmo)+1)%3]);
$('btn-top').onclick=()=>{
  const items=LANDMARKS.map(l=>({k:'landmark',id:l.id,t:l.name,s:l.tag+' · ❤️ '+state.likes[l.id],sc:state.likes[l.id]}));
  Object.values(state.plots).forEach(r=>items.push({k:'plot',id:r.plotNum,t:r.category==='career'?r.bizName:r.owner+' uyi',s:r.floors+' qavat · #'+r.plotNum.toLocaleString(),sc:r.floors}));
  items.sort((a,b)=>b.sc-a.sc);const w=$('top-list');w.innerHTML='';
  items.slice(0,10).forEach((it,i)=>{const b=document.createElement('button');b.className='w-full text-left rounded-2xl p-3 bg-white/5 hover:bg-white/15 border border-white/10';
    const a=document.createElement('div');a.className='font-bold text-sm truncate';a.textContent=(i+1)+'. '+it.t;const s=document.createElement('div');s.className='text-xs text-slate-300 truncate';s.textContent=it.s;
    b.append(a,s);b.onclick=()=>{close('m-top');select(it.k,it.id,true)};w.appendChild(b)});open('m-top')};
$('i-like').onclick=()=>{if(!sel||sel.kind!=='landmark')return;const k=sel.id,i=state.liked.indexOf(k);if(i>=0){state.liked.splice(i,1);state.likes[k]--}else{state.liked.push(k);state.likes[k]++}localSave();$('i-likes').textContent=state.likes[k]};
$('btn-db').onclick=()=>open('m-db');
$('btn-export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({plots:state.plots},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='toshkent_plots.json';a.click();URL.revokeObjectURL(u)};
$('btn-reset').onclick=()=>{if(!confirm('Lokal shahar to‘liq o‘chiriladi. Davom etasizmi?'))return;state.plots={};localSave();setCount(0);needRebuild=true;hide();close('m-db')};
const sparks=[],sphere=new THREE.SphereGeometry(.45,6,6),fxM=[0x38bdf8,0xf43f5e,0xfacc15,0xa855f7,0x34d399].map(c=>new THREE.MeshBasicMaterial({color:c}));
function burst(x,z){const m=fxM[Math.floor(Math.random()*5)],o=new THREE.Vector3(x+(Math.random()-.5)*14,28+Math.random()*14,z+(Math.random()-.5)*14);
  for(let i=0;i<40;i++){const s=new THREE.Mesh(sphere,m);s.position.copy(o);fxG.add(s);const p=Math.acos(2*Math.random()-1),t=Math.random()*6.283,v=7+Math.random()*12;sparks.push({s,v:new THREE.Vector3(v*Math.sin(p)*Math.cos(t),v*Math.cos(p),v*Math.sin(p)*Math.sin(t)),l:1.15})}}
function fireworks(x,z){for(let i=0;i<3;i++)setTimeout(()=>burst(x,z),i*210)}
$('n-fw').onclick=()=>fireworks(controls.target.x,controls.target.z);
const zoom=f=>{camera.position.copy(controls.target).add(camera.position.clone().sub(controls.target).multiplyScalar(f))},rot=a=>{camera.position.copy(controls.target).add(camera.position.clone().sub(controls.target).applyAxisAngle(new THREE.Vector3(0,1,0),a))};
$('c-in').onclick=()=>zoom(.8);$('c-out').onclick=()=>zoom(1.22);$('c-l').onclick=()=>rot(-.32);$('c-r').onclick=()=>rot(.32);$('c-0').onclick=()=>flyTo(0,0,76,62);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// ====== ISHGA TUSHIRISH ======
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(fly){fly.p=Math.min(1,fly.p+dt*1.35);const e=1-Math.pow(1-fly.p,3);controls.target.lerpVectors(fly.a,fly.b,e);camera.position.lerpVectors(fly.ca,fly.cb,e);if(fly.p>=1)fly=null}
  controls.update();const tg=controls.target;ground.position.set(tg.x,0,tg.z);
  sun.position.set(tg.x+100,tg.y+140,tg.z+85);sun.target.position.copy(tg);   // soya kamera bilan birga yuradi
  stream(false);if(beacon)beacon.emissiveIntensity=1.4+Math.sin(t*5)*1.1;
  traffic.forEach(c=>{c.position.z+=c.userData.dir*c.userData.sp*dt;if(Math.abs(c.position.z-tg.z)>160||Math.abs(c.position.x-tg.x)>140)placeCar(c,false)});
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.l-=dt*.9;if(p.l<=0){fxG.remove(p.s);sparks.splice(i,1);continue}p.v.y-=7.5*dt;p.s.position.addScaledVector(p.v,dt);p.s.scale.setScalar(Math.max(.05,p.l))}
  renderer.render(scene,camera)}
stream(true);animate();initServer();
})();
</script>
